<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching your app's theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    
    <!-- Primary Blue Gradient matching your 'Predict Death' button -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Medical Cross / Forecast Symbol -->
  <g transform="translate(256, 256)">
    <!-- Vertical Bar -->
    <rect x="-36" y="-130" width="72" height="260" rx="16" fill="url(#primaryGrad)" />
    <!-- Horizontal Bar -->
    <rect x="-130" y="-36" width="260" height="72" rx="16" fill="url(#primaryGrad)" />
    
    <!-- Inner Pulse / Timeline Accent -->
    <path d="M-80 0 L-30 0 L-10 -40 L10 40 L30 0 L80 0" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
